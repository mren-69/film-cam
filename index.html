<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FILM CAM">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>FILM CAM</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <button id="placeBtn" class="chip" type="button">
      <span class="pin">●</span><span id="placeText">位置を取得中…</span>
    </button>
    <div class="top-right">
      <button id="importBtn" class="icon-btn" type="button" aria-label="ライブラリから加工">IMG</button>
      <button id="timerBtn" class="icon-btn" type="button" aria-label="セルフタイマー">⏱<small id="timerLabel">OFF</small></button>
      <button id="stampBtn" class="icon-btn on" type="button" aria-label="日付の写し込み">DATE</button>
    </div>
  </header>

  <main class="viewfinder-wrap">
    <div id="viewfinder" class="viewfinder">
      <div class="screen">
        <video id="video" playsinline muted autoplay></video>
        <div id="filmTint" class="film-tint"></div>
        <div class="vignette"></div>
        <div id="previewStamp" class="preview-stamp"></div>
        <div id="vhsPlay" class="vhs-play hidden">PLAY ▶</div>
        <div id="countdown" class="countdown"></div>
        <div id="flash" class="flash"></div>
        <div id="camMsg" class="cam-msg hidden">
          <p id="camMsgText">カメラを使うには許可が必要です</p>
          <button id="camStartBtn" type="button">カメラを起動</button>
        </div>
      </div>
      <div id="handStamp" class="hand-stamp"></div>
    </div>
  </main>

  <nav id="films" class="films"></nav>

  <footer class="controls">
    <button id="thumbBtn" class="thumb empty" type="button" aria-label="最後に撮った写真"></button>
    <button id="shutter" class="shutter" type="button" aria-label="撮影"><span></span></button>
    <button id="flipBtn" class="round-btn" type="button" aria-label="カメラ切り替え">⇄</button>
  </footer>
</div>

<div id="developing" class="developing hidden">
  <div class="dev-box"><div class="spinner"></div><p>現像中…</p></div>
</div>

<div id="result" class="result hidden">
  <div class="result-inner">
    <img id="resultImg" alt="撮影した写真">
    <p class="hint">「写真に保存」→「画像を保存」で写真アプリに入ります。<br>（写真を長押ししても保存できます）</p>
    <div class="result-actions">
      <button id="backBtn" type="button">戻る</button>
      <button id="saveBtn" class="primary" type="button">写真に保存</button>
    </div>
  </div>
</div>

<div id="placeModal" class="modal hidden">
  <div class="modal-box">
    <h2>写し込む場所</h2>
    <p class="small">ローマ字で入力（例: NAMBA, OSAKA）。空欄にすると場所は入りません。</p>
    <input id="placeInput" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="40">
    <p class="small" id="gpsInfo"></p>
    <div class="modal-actions">
      <button id="placeAuto" type="button">自動(GPS)に戻す</button>
      <button id="placeOk" class="primary" type="button">決定</button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" hidden>

<script src="places.js"></script>
<script src="app.js"></script>
</body>
</html>
